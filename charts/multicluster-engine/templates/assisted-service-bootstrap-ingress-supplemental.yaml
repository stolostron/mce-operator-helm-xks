apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assisted-service-bootstrap-ingress-supplemental
  namespace: multicluster-engine
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-ingress
